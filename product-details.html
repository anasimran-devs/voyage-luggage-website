<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product — Voyage</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Details CSS -->
    <link rel="stylesheet" href="css/details.css">

</head>


<body>

  <div id="navbar"></div>

<!-- ================= PRODUCT DETAILS ================= -->

<section class="details-page">

    <div class="container">


        <!-- ================= BREADCRUMB ================= -->

        <div class="product-breadcrumb">

            <a href="index.html">
                Home
            </a>

            <i class="bi bi-chevron-right"></i>

            <a href="products.html">
                Shop
            </a>

            <i class="bi bi-chevron-right"></i>

            <span id="detailsBreadcrumb">
                Product
            </span>

        </div>



        <!-- ================= PRODUCT ================= -->

        <div class="row product-details-row">


            <!-- ================= PRODUCT IMAGE ================= -->

            <div class="col-lg-7">

                <div class="product-main-image">


                    <!-- BADGE -->

                    <span
                        class="details-badge"
                        id="detailsBadge">
                    </span>


                    <!-- WISHLIST -->

                    <button
                        class="details-wishlist"
                        type="button">

                        <i class="bi bi-heart"></i>

                    </button>


                    <!-- MAIN IMAGE -->

                    <div class="details-placeholder">

                        <img
                            id="detailsMainImage"
                            src=""
                            alt="Product"
                        >

                    </div>

                </div>


                <!-- ================= THUMBNAILS ================= -->

                <div
                    class="product-thumbnails"
                    id="productThumbnails">
                </div>

            </div>



            <!-- ================= PRODUCT INFORMATION ================= -->

            <div class="col-lg-5">

                <div class="product-details-info">


                    <!-- CATEGORY -->

                    <p
                        class="details-category"
                        id="detailsCategory">
                        PRODUCT
                    </p>


                    <!-- NAME -->

                    <h1 id="detailsName">
                        Product
                    </h1>


                    <!-- RATING -->

                    <div class="details-rating">

                        <div class="stars">

                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-fill"></i>
                            <i class="bi bi-star-half"></i>

                        </div>

                        <span>
                            4.8 · 124 Reviews
                        </span>

                    </div>


                    <!-- PRICE -->

                    <div
                        class="details-price"
                        id="detailsPrice">
                        $0
                    </div>


                    <!-- DESCRIPTION -->

                    <p
                        class="details-description"
                        id="detailsDescription">
                    </p>



                    <!-- DIVIDER -->

                    <div class="details-divider"></div>



                    <!-- ================= COLOR ================= -->

                    <div class="product-option">

                        <div class="option-title">

                            <strong>
                                Color
                            </strong>

                            <span id="selectedColor">
                                Onyx Black
                            </span>

                        </div>


                        <div class="color-options">

                            <button
                                class="color-option black active"
                                data-color="Onyx Black"
                                title="Onyx Black">
                            </button>

                            <button
                                class="color-option silver"
                                data-color="Silver"
                                title="Silver">
                            </button>

                            <button
                                class="color-option stone"
                                data-color="Stone"
                                title="Stone">
                            </button>

                        </div>

                    </div>



                    <!-- ================= SIZE ================= -->

                    <div class="product-option">

                        <div class="option-title">

                            <strong>
                                Size
                            </strong>

                            <span id="selectedSize">
                                Standard
                            </span>

                        </div>


                        <div
                            class="size-options"
                            id="sizeOptions">
                        </div>

                    </div>



                    <!-- ================= QUANTITY ================= -->

                    <div class="product-option">

                        <div class="option-title">

                            <strong>
                                Quantity
                            </strong>

                        </div>


                        <div class="quantity-wrapper">

                            <button
                                class="quantity-btn"
                                id="detailsMinus"
                                type="button">
                                −
                            </button>


                            <span
                                class="quantity"
                                id="detailsQuantity">
                                1
                            </span>


                            <button
                                class="quantity-btn"
                                id="detailsPlus"
                                type="button">
                                +
                            </button>

                        </div>

                    </div>



                    <!-- ================= BUTTONS ================= -->

                    <div class="details-buttons">

                        <button
                            class="add-to-cart-btn"
                            id="detailsAddToCart"
                            type="button">

                            Add to Cart

                            <i class="bi bi-bag"></i>

                        </button>


                        <button
                            class="buy-now-btn"
                            id="buyNowBtn"
                            type="button">

                            Buy Now

                            <i class="bi bi-arrow-right"></i>

                        </button>

                    </div>



                    <!-- ================= BENEFITS ================= -->

                    <div class="product-benefits">


                        <div class="benefit">

                            <i class="bi bi-truck"></i>

                            <div>

                                <strong>
                                    Free Shipping
                                </strong>

                                <span>
                                    On orders over $100
                                </span>

                            </div>

                        </div>


                        <div class="benefit">

                            <i class="bi bi-arrow-repeat"></i>

                            <div>

                                <strong>
                                    Easy Returns
                                </strong>

                                <span>
                                    30-day return policy
                                </span>

                            </div>

                        </div>


                        <div class="benefit">

                            <i class="bi bi-shield-check"></i>

                            <div>

                                <strong>
                                    5 Year Warranty
                                </strong>

                                <span>
                                    Built to last
                                </span>

                            </div>

                        </div>


                    </div>


                </div>

            </div>

        </div>

    </div>

</section>



<!-- ================= PRODUCT INFORMATION ================= -->

<section class="product-information">

    <div class="container">

        <div class="information-grid">


            <!-- MATERIAL -->

            <div class="information-item">

                <span>
                    MATERIAL
                </span>

                <strong id="detailsMaterial">
                    Premium Material
                </strong>

            </div>


            <!-- DIMENSIONS -->

            <div class="information-item">

                <span>
                    DIMENSIONS
                </span>

                <strong id="detailsDimensions">
                    —
                </strong>

            </div>


            <!-- WEIGHT -->

            <div class="information-item">

                <span>
                    WEIGHT
                </span>

                <strong id="detailsWeight">
                    —
                </strong>

            </div>


            <!-- CAPACITY -->

            <div class="information-item">

                <span>
                    CAPACITY
                </span>

                <strong id="detailsCapacity">
                    —
                </strong>

            </div>


        </div>

    </div>

</section>

<div id="footer"></div>

<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Main JS -->

<script src="js/main.js"></script>
<script src="js/navbar.js"></script>
<script src="js/footer.js"></script>


</body>

</html>
